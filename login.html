<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In — SmartCheckAI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"></head><body data-page="login"><main class="login"><section class="login-card"><div style="text-align:center;margin-bottom:22px"><div class="brand-mark" style="margin:auto;width:58px;height:58px;font-size:23px">E</div><h1 class="title" style="margin-top:14px">Welcome to SmartCheckAI</h1><p class="subtitle">Sign in to manage your answer sheets</p></div><div class="card"><label class="form-label">Email</label><input class="input" type="email" placeholder="teacher@school.com"><div style="height:13px"></div><label class="form-label">Password</label><input class="input" type="password" placeholder="••••••••"><div class="row" style="font-size:13px;margin:12px 0 18px"><label><input type="checkbox"> Remember me</label><button style="border:0;background:none;color:var(--blue)" onclick="toast('Password reset is frontend-only')">Forgot password?</button></div><a class="primary" style="display:block;text-align:center" href="dashboard.html">Sign In</a><p style="text-align:center;color:var(--muted);font-size:13px">Or continue with</p><div class="grid grid2"><button class="secondary" onclick="toast('Google sign-in will be connected later')">Google</button><button class="secondary" onclick="toast('Facebook sign-in will be connected later')">Facebook</button></div><p style="text-align:center;font-size:13px;color:var(--muted)">Don't have an account? <button style="border:0;background:none;color:var(--blue)" onclick="toast('Sign-up is frontend-only')">Sign up</button></p></div></section></main><div id="toast" class="toast"></div><script src="app.j
